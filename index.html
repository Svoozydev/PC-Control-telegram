<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Remote Control</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #181c24;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --text: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 { margin-bottom: 20px; }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary { background-color: var(--accent); color: white; }
        .btn-primary:active { background-color: var(--accent-hover); }

        .btn-danger { background-color: var(--danger); color: white; }
        .btn-danger:active { background-color: var(--danger-hover); }
    </style>
</head>
<body>

    <h2>💻 Управление ПК</h2>

    <div class="container">
        <div class="card" style="display: flex; flex-direction: column; gap: 10px;">
            <button class="btn btn-primary" onclick="sendCommand('screenshot')">📸 Сделать скриншот</button>
            <button class="btn btn-primary" onclick="sendCommand('status')">📊 Обновить статус</button>
            <button class="btn btn-primary" onclick="sendCommand('lock')">🔒 Заблокировать ПК</button>
            <button class="btn btn-danger" onclick="sendCommand('shutdown')">⏻ Выключить ПК</button>
            <button class="btn btn-primary" style="background-color: #374151;" onclick="sendCommand('cancel_shutdown')">🛑 Отмена выключения</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        function sendCommand(action) {
            // Проверяем, открыто ли приложение именно в Telegram
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                // Отправляем JSON-строку боту и закрываем мини-апп
                tg.sendData(JSON.stringify({ command: action }));
            } else {
                alert("Команда '" + action + "' (тестовый режим вне Telegram)");
            }
        }
    </script>
</body>
</html>
