<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Remote Control</title>
    <!-- Официальная библиотека Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0b0f19;
            --card: #151b2b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --text: #f3f4f6;
            --muted: #9ca3af;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { margin-bottom: 15px; font-size: 20px; }
        .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
        .card {
            background-color: var(--card);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .grid-buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .btn {
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            color: white;
            background-color: var(--accent);
            transition: 0.2s;
        }
        .btn:active { background-color: var(--accent-hover); transform: scale(0.97); }
        .btn-danger { background-color: var(--danger); }
        .btn-full { grid-column: span 2; }

        #toast {
            position: fixed; bottom: 20px; background: #1f2937; color: white;
            padding: 10px 20px; border-radius: 20px; font-size: 13px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); display: none; z-index: 100;
        }
    </style>
</head>
<body>

    <h2>💻 Управление ПК</h2>

    <div class="container">
        <div class="card">
            <div class="grid-buttons">
                <button class="btn btn-full" onclick="sendAction('screenshot')">📸 Сделать скриншот</button>
                <button class="btn btn-full" onclick="sendAction('status')">📊 Статус ПК</button>
                <button class="btn" onclick="sendAction('media_play')">🎵 Play / Pause</button>
                <button class="btn" onclick="sendAction('volume_mute')">🔇 Звук Mute</button>
                <button class="btn" onclick="sendAction('open_youtube')">▶️ YouTube</Link>
                <button class="btn" onclick="sendAction('empty_recycle')">🗑 Корзина</button>
                <button class="btn" onclick="sendAction('lock')">🔒 Блокировать</button>
                <button class="btn btn-danger" onclick="sendAction('shutdown')">⏻ Выключить</button>
            </div>
        </div>
    </div>

    <div id="toast">Команда отправлена!</div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        const API_URL = "http://192.168.1.15:5000";

        function showToast(text) {
            let t = document.getElementById('toast');
            t.innerText = text;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        function sendAction(action) {
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                // Безопасно отправляем данные боту без всяких серверов и ngrok
                tg.sendData(JSON.stringify({ action: action }));
                showToast("Команда отправлена боту!");
            } else {
                // Если открыто в обычном браузере для теста
                showToast("Тестовый режим (вне Telegram)");
                console.log("Action:", action);
            }
        }
    </script>
</body>
</html>
